<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2C3E50"/>
      <stop offset="100%" stop-color="#1A252F"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>

  <!-- Connection lines from center to outer nodes -->
  <!-- Top -->
  <line x1="256" y1="256" x2="256" y2="100" stroke="#27AE60" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  <!-- Top-right -->
  <line x1="256" y1="256" x2="390" y2="146" stroke="#27AE60" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  <!-- Right -->
  <line x1="256" y1="256" x2="412" y2="256" stroke="#3498DB" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  <!-- Bottom-right -->
  <line x1="256" y1="256" x2="390" y2="366" stroke="#3498DB" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  <!-- Bottom -->
  <line x1="256" y1="256" x2="256" y2="412" stroke="#E67E22" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  <!-- Bottom-left -->
  <line x1="256" y1="256" x2="122" y2="366" stroke="#E67E22" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  <!-- Left -->
  <line x1="256" y1="256" x2="100" y2="256" stroke="#27AE60" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  <!-- Top-left -->
  <line x1="256" y1="256" x2="122" y2="146" stroke="#3498DB" stroke-width="8" stroke-linecap="round" opacity="0.7"/>

  <!-- Outer nodes (clients/sensors) -->
  <circle cx="256" cy="100" r="24" fill="#27AE60"/>
  <circle cx="390" cy="146" r="24" fill="#27AE60"/>
  <circle cx="412" cy="256" r="24" fill="#3498DB"/>
  <circle cx="390" cy="366" r="24" fill="#3498DB"/>
  <circle cx="256" cy="412" r="24" fill="#E67E22"/>
  <circle cx="122" cy="366" r="24" fill="#E67E22"/>
  <circle cx="100" cy="256" r="24" fill="#27AE60"/>
  <circle cx="122" cy="146" r="24" fill="#3498DB"/>

  <!-- Central hub (broker) — larger, prominent -->
  <circle cx="256" cy="256" r="52" fill="#ECF0F1"/>
  <circle cx="256" cy="256" r="40" fill="#2C3E50"/>

  <!-- "M" letter in center for Mosquitto -->
  <text x="256" y="270" text-anchor="middle" font-family="Helvetica,Arial,sans-serif"
        font-weight="bold" font-size="44" fill="#ECF0F1">M</text>
</svg>
